# License-free verification matrix: elaboration gates the simulation tier.
#
# House rules, enforced in review:
#   - no `|| true` and no `continue-on-error` on any step of a gating job;
#   - no negated grep as a pass criterion; every simulation leg checks exit status
#     AND a non-empty log AND a positive token (util/run_vlt_sim.py);
#   - no numeric warning-count thresholds;
#   - every excluded top or configuration is named below with its reason;
#   - `needs:` orders jobs, it does not share workspaces; every job regenerates.
#
# NAMED EXCLUSIONS - dropped coverage, not silent skips. All need triage; none may
# be flagged away to make a leg green.
#   tb_idma_nd_midend_b2b   hangs ([B2B] timeout); latent reset/LFSR race
#   tb_idma_transpose_nd    AW outside the destination allocation at 80 ns
#   tb_idma_transpose_b2b   stream_watchdog trip after 4000 idle cycles
#   tb_idma_mxrand          testbench timeout at 400 ms of simulated time
#   tb_idma_mxperf          hangs on the first compute transfer
#   tb_idma_rt_midend       fails under --assert on cc_rr_arb_tree lock
#   mxneg case 11           the request is never accepted, so
#                           ComputeMxdequantLengthFits is never sampled
#   ComputeDstTilelink      no TileLink backend variant exists to test it
#   mxneg cases 4 and 12    DataWidth 1024 SIGSEGVs on verilator 5.020; both pass
#                           on 5.046, so this is a toolchain limit, not a gap
#   mxroundtrip above 256   glibc heap abort, and 5.046 moves it to 256 instead of
#                           fixing it; a live bug, not a width limit
#   the 88 directed job files
#                           verilator cannot simulate the idma_test class-based
#                           driver (virtual interface, input combinational region
#                           does not converge)
# Both are named in idma.mk next to the table that drives them, and
# util/check_jobs.py fails if either list drifts from the design.
#
# mxquant at DataWidth 512 and 1024 was on this list as a verilator crash. It was
# not: the C++ compiler was, and both widths run once idma.mk pins it. Never waive
# a leg on a toolchain symptom without testing another toolchain.

name: verify

on:
  workflow_call:
  workflow_dispatch:

jobs:

  # Codegen hygiene, not verification: jobs.json and the generated tree must still
  # describe the same design, and a second generation must be identical
  codegen-consistency:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
      -
        name: Check jobs.json, the CI matrix and codegen determinism
        run: uv run --locked make idma_verify_codegen

  # One backend variant under both front ends, with its real jobs.json parameters,
  # a DataWidth sweep and slang elaboration of that variant's testbench
  elab-backend:
    strategy:
      fail-fast: false
      matrix:
        id:
          - rw_axi
          - r_obi_w_axi
          - r_axi_w_obi
          - rw_axi_rw_axis
          - rw_obi
          - r_obi_rw_init_w_axi
          - r_axi_rw_init_rw_obi
          - rw_axi_rw_init_rw_obi
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Elaborate ${{ matrix.id }}
        run: uv run --locked make idma_verify_backend IDMA_VERIFY_ID=${{ matrix.id }}

  # The four non-backend synthesis tops with their own jobs.json parameters, plus the
  # default-parameter elaboration of all 12 tops and of the inst64 testbench
  elab-shared-tops:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Elaborate the shared synthesis tops
        run: uv run --locked make idma_verify_shared

  # Testbench tops that are not per-backend, including the three generated register
  # frontends; verilator cannot parse the verification stack, so slang is the only tool
  elab-tb-shared:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Elaborate the shared testbenches
        run: uv run --locked make idma_verify_tb_shared

  # Out-of-tree multi-head build; license-free but generated only on request
  elab-multihead:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Elaborate the multi-head variants and testbenches
        run: uv run --locked make idma_verify_multihead

  # Real simulation, byte-exact against the DPI-C goldens; the destination is
  # pre-poisoned, so a backend that writes nothing fails
  sim-datapath-mxquant:
    needs: [elab-backend, elab-shared-tops, elab-tb-shared]
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Simulate tb_idma_mxquant at DataWidth 32 to 1024
        run: uv run --locked make idma_verify_sim_mxquant IDMA_VLT_MAKEFLAGS=-j4

  sim-datapath-mxroundtrip:
    needs: [elab-backend, elab-shared-tops, elab-tb-shared]
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Simulate tb_idma_mxroundtrip at DataWidth 32, 64 and 256
        run: uv run --locked make idma_verify_sim_mxroundtrip IDMA_VLT_MAKEFLAGS=-j4

  sim-datapath-transpose:
    needs: [elab-backend, elab-shared-tops, elab-tb-shared]
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Simulate the transpose datapath, plain and backpressured
        run: uv run --locked make idma_verify_sim_transpose IDMA_VLT_MAKEFLAGS=-j4

  # Negative tests, inverted polarity: the run must exit non-zero AND name its guard.
  # --assert is load-bearing; without it both testbenches exit 0 and cannot fail
  sim-negative:
    needs: [elab-backend, elab-shared-tops, elab-tb-shared]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mxclear-and-cases-1-3
            clear: 'yes'
            cases: 1 2 3
          - name: cases-5-7
            clear: 'no'
            cases: 5 6 7
          - name: cases-8-13
            clear: 'no'
            cases: 8 10 13
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
        with:
          verilator: 'true'
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Check the clear-with-in-flight-state guard
        if: matrix.clear == 'yes'
        run: uv run --locked make idma_verify_sim_mxclear IDMA_VLT_MAKEFLAGS=-j4
      -
        name: Check legalizer compute guards ${{ matrix.name }}
        run: |
          uv run --locked make idma_verify_sim_mxneg IDMA_VLT_MAKEFLAGS=-j4 \
            IDMA_MXNEG_CASES="${{ matrix.cases }}"

  # A report, not a gate: -Wextra without -Werror, so findings do not fail the job and
  # a real compile error still does. Never add it to the required checks
  report-slang-extra:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up toolchain
        uses: ./.github/actions/verify-setup
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Collect slang -Wextra findings
        run: uv run --locked make idma_slang_report
      -
        name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: slang-extra
          path: target/verify/slang_extra.txt
