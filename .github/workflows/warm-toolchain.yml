name: warm-toolchain

on:
  workflow_call:
  workflow_dispatch:

jobs:

  warm:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Restore package cache
        id: debs
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-debs
          key: apt-debs-ubuntu-24.04-${{ runner.arch }}-v2
      -
        name: Download packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/apt-debs"
          sudo apt-get update
          sudo apt-get install -y -d \
            -o Dir::Cache::archives="$HOME/.cache/apt-debs" \
            ccache
          ls -1 "$HOME/.cache/apt-debs"/*.deb | wc -l
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Prepare the OSEDA tool prefix
        run: sudo mkdir -p /foss/tools && sudo chown "$USER" /foss/tools
      -
        name: Restore the OSEDA Verilator
        id: oseda
        uses: actions/cache@v4
        with:
          path: /foss/tools/verilator
          key: oseda-verilator-2026.09-${{ runner.arch }}-v1
      -
        name: Copy Verilator out of the OSEDA 2026.09 image
        if: steps.oseda.outputs.cache-hit != 'true'
        run: .github/actions/verify-setup/oseda-verilator.sh
