name: warm-toolchain

on:
  workflow_call:
  workflow_dispatch:

jobs:

  warm:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Restore package cache
        id: debs
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-debs
          key: apt-debs-ubuntu-24.04-${{ runner.arch }}-v4
      -
        name: Download packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/apt-debs"
          sudo apt-get update
          sudo apt-get install -y -d \
            -o Dir::Cache::archives="$HOME/.cache/apt-debs" \
            ccache
          ls -1 "$HOME/.cache/apt-debs"/*.deb | wc -l
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Restore Verilator
        id: verilator
        uses: actions/cache@v4
        with:
          path: ~/.cache/verilator
          key: verilator-${{ runner.arch }}-${{ hashFiles('.github/actions/verify-setup/*.sh') }}
      -
        name: Copy Verilator out of its official image
        if: steps.verilator.outputs.cache-hit != 'true'
        run: .github/actions/verify-setup/verilator.sh
