name: ci

on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches-ignore:
      - '__deploy__**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  # PRs lint their title instead (lint-pr.yml); nothing waits on this
  lint-commit:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/lint-commit.yml
    secrets: inherit

  warm-toolchain:
    uses: ./.github/workflows/warm-toolchain.yml
    secrets: inherit

  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    secrets: inherit

  analyze:
    needs: lint
    uses: ./.github/workflows/analyze.yml
    secrets: inherit

  elaborate:
    needs: [lint, warm-toolchain]
    uses: ./.github/workflows/elaborate.yml
    secrets: inherit

  simulate:
    needs: elaborate
    uses: ./.github/workflows/simulate.yml
    secrets: inherit

  # PRs touching only docs or unrelated files skip the internal CI
  changes:
    runs-on: ubuntu-latest
    outputs:
      internal: ${{ steps.gate.outputs.internal }}
    steps:
      -
        name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      -
        name: Check changed files
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          internal=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            internal=$(git show "$BASE_SHA:util/ci-internal-needed.sh" |
              bash -s -- "$BASE_SHA" "$HEAD_SHA") || true
            [ "$internal" = false ] || internal=true
          fi
          echo "internal=$internal" | tee -a "$GITHUB_OUTPUT"

  # The licensed EDA pipeline runs only once the license-free matrix is green
  gitlab-ci:
    needs: [build, elaborate, simulate, changes]
    if: needs.changes.outputs.internal == 'true'
    uses: ./.github/workflows/gitlab-ci.yml
    secrets: inherit

  deploy:
    permissions:
      contents: write
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
