name: ci

on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches-ignore:
      - '__deploy__**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  warm-toolchain:
    uses: ./.github/workflows/warm-toolchain.yml
    secrets: inherit

  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    secrets: inherit

  analyze:
    needs: lint
    uses: ./.github/workflows/analyze.yml
    secrets: inherit

  verify:
    needs: [lint, warm-toolchain]
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  # The licensed EDA pipeline runs only once the license-free matrix is green
  gitlab-ci:
    needs: [build, verify]
    uses: ./.github/workflows/gitlab-ci.yml
    secrets: inherit

  deploy:
    permissions:
      contents: write
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
