name: docs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  doc:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.9'
          activate-environment: true
      -
        name: Install Python requirements
        run: uv pip install -r requirements.txt
      -
        name: Install RISC-V GCC toolchain
        uses: pulp-platform/pulp-actions/riscv-gcc-install@v2.5.0
        with:
          distro: ubuntu-22.04
          nightly-date: '2023.03.14'
          target: riscv64-elf
      -
        name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
      -
        name: Install Bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.0
        with:
          version: 0.32.0
      -
        name: Build Doc
        run: make idma_doc_all
      -
        name: Create publish docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc/html

  deploy-pages:
    needs: doc
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.output.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      -
        name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
