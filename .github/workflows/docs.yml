name: docs

on:
  push:
    branches: [ master, devel ]
  pull_request:
    branches: [ master, devel ]
  workflow_dispatch:

jobs:

  doc:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Cache Bender database
        uses: ./.github/actions/bender-db-cache
      -
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      -
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: doc/site/package-lock.json
      -
        name: Install RISC-V GCC toolchain
        uses: pulp-platform/pulp-actions/riscv-gcc-install@v2.5.0
        with:
          distro: ubuntu-22.04
          nightly-date: '2023.03.14'
          target: riscv64-elf
      -
        name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
      -
        name: Install Bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.0
        with:
          version: 0.32.0
      -
        name: Build Doc
        run: uv run --locked make idma_doc_all
      -
        name: Create publish docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/site/dist

  deploy-pages:
    needs: doc
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.output.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      -
        name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5
