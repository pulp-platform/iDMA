# The public verification matrix. util/run_verify.py runs a suite from here and
# emits the CI matrix from the same entries. Excluded legs are `exclude:` entries
# with a reason; check_jobs.py fails on anything neither run nor excluded.

# Every jobs.json entry pins DataWidth=32, so nothing wider is elaborated otherwise
elab_widths: [32, 64, 512, 1024]

# No jobs.json entry enables compute, so its branches are unreachable without these
elab_compute:
  - {width: 64,  ops: 15, tuning: 1, why: every sub-unit, ping-pong transpose banks}
  - {width: 512, ops: 15, tuning: 1, why: the wide bus, where pack/unpack is stressed}
  - {width: 64,  ops: 8,  tuning: 0, why: transpose only, single bank}
  - {width: 64,  ops: 6,  tuning: 1, why: mx only, Fp16En=0, the no-transpose branch}

# Non-backend synthesis tops, elaborated with their own jobs.json parameters
elab_shared_tops: [idma_desc64_synth, idma_nd_midend_synth, idma_mp_midend_synth,
                   idma_rt_midend_synth]

# Out-of-tree multi-head variants; license-free but generated only on request
multihead_ids: [2r_axi_w_axi, 2rw_axi]

# The one public concrete binding; without this, 2d and 1d have no leg
reg_variants:
  - {variant: 3, module: idma_reg32_3d}
  - {variant: 2, module: idma_reg64_2d}
  - {variant: 1, module: idma_reg64_1d}

# Elaborated by a dedicated leg, so the shared sweep skips them
elab_covered_elsewhere: [tb_idma_reg_frontend]

# One CI leg per run. `expect: fail` inverts the polarity: non-zero AND the token.
suites:

  mxquant:
    top: tb_idma_mxquant
    dpi: idma_mxquant_dpi
    token: "[MXQ] ALL PASS"
    sweep: {param: DataWidth, values: [32, 64, 256, 512, 1024]}

  mxroundtrip:
    top: tb_idma_mxroundtrip
    dpi: idma_mxquant_dpi
    token: "[MXRT] ALL PASS"
    sweep: {param: DataWidth, values: [32, 64, 256]}
    exclude:
      - {values: [512, 1024], why: "heap abort during model construction, see #196"}

  transpose:
    top: tb_idma_otf_transpose
    dpi: idma_transpose_dpi
    token: "[TB] ALL PASS"
    runs:
      - {tag: otf_transpose,       params: {StrbWidth: 8,  FullDuplex: 1}}
      # +BP is a second stimulus, backpressured, not a rerun
      - {tag: otf_transpose_bp,    params: {StrbWidth: 8,  FullDuplex: 1}, plusargs: ["+BP"]}
      - {tag: otf_transpose_8_0,   params: {StrbWidth: 8,  FullDuplex: 0}, plusargs: ["+BP"]}
      - {tag: otf_transpose_64_1,  params: {StrbWidth: 64, FullDuplex: 1}, plusargs: ["+BP"]}
      - {tag: otf_transpose_64_0,  params: {StrbWidth: 64, FullDuplex: 0}, plusargs: ["+BP"]}

  transpose_midend:
    top: tb_idma_transpose_midend
    dpi: idma_transpose_dpi
    token: "[MID] ALL PASS"
    sweep: {param: DataWidth, values: [64, 512]}

  mxclear:
    top: tb_idma_mxclear
    token: "clear with in-flight state"
    expect: fail
    defines: [INC_ASSERT]
    sweep: {param: Quant, values: [1, 0]}

  # token is the guard name, so a case firing the wrong guard fails
  mxneg:
    top: tb_idma_mxneg
    dpi: idma_mxquant_dpi
    expect: fail
    defines: [INC_ASSERT]
    runs:
      - {tag: mxneg_1,  token: ComputeSizeAligned,           params: {NegCase: 1,  DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_2,  token: ComputeSrcAligned,            params: {NegCase: 2,  DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_3,  token: ComputeDstAligned,            params: {NegCase: 3,  DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_5,  token: ComputeMxdequantBeatAligned,  params: {NegCase: 5,  DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_6,  token: ComputeOpUnsupported,         params: {NegCase: 6,  DataWidth: 64, EnDequant: 0, EnFp16: 1}}
      - {tag: mxneg_7,  token: ComputeMxSrcProtocol,         params: {NegCase: 7,  DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_8,  token: ComputeMxDstProtocol,         params: {NegCase: 8,  DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_10, token: ComputeTransposeSingleBeat,   params: {NegCase: 10, DataWidth: 64, EnDequant: 1, EnFp16: 1}}
      - {tag: mxneg_13, token: ComputeOpUnsupported,         params: {NegCase: 13, DataWidth: 64, EnDequant: 1, EnFp16: 0}}
    exclude:
      - {case: 4,  why: "DataWidth 1024 SIGSEGVs on verilator 5.020; passes on 5.046"}
      - {case: 11, why: "the request is never accepted, so the guard is never sampled"}
      - {case: 12, why: "DataWidth 1024 SIGSEGVs on verilator 5.020; passes on 5.046"}

# Guards with no firing negative test; check_jobs.py fails on any not named here
guards_untested:
  - {guard: ComputeMxFp16Width,          why: "only reachable from the excluded 1024 cases"}
  - {guard: ComputeMxdequantLengthFits,  why: "case 11 is never accepted"}
  - {guard: ComputeDstTilelink,          why: "no TileLink backend variant exists"}

# Excluded from the simulation tier. Dropped coverage, not silent skips; needs triage.
tops_untested:
  - {top: tb_idma_nd_midend_b2b, why: "hangs ([B2B] timeout); latent reset/LFSR race"}
  - {top: tb_idma_transpose_nd,  why: "AW outside the destination allocation at 80 ns"}
  - {top: tb_idma_transpose_b2b, why: "stream_watchdog trip after 4000 idle cycles"}
  - {top: tb_idma_mxrand,        why: "testbench timeout at 400 ms of simulated time"}
  - {top: tb_idma_mxperf,        why: "hangs on the first compute transfer"}
  - {top: tb_idma_rt_midend,     why: "fails under --assert on cc_rr_arb_tree lock"}
  - {top: the 88 directed job files,
     why: "verilator cannot drive the idma_test class-based stimulus"}
