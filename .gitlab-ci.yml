variables:
  IDMA_NONFREE_COMMIT: common-cells-v2

default:
  interruptible: true
  hooks:
    pre_get_sources_script:
      - rm -rf "${CI_PROJECT_DIR}.tmp/git-template"
      - find "${CI_PROJECT_DIR}.tmp" -name '*.lock' -delete 2>/dev/null || true

stages:
  - init
  - idma

init:
  stage: init
  before_script:
    - uv sync --locked
    - source .venv/bin/activate
  script:
    - make idma_nonfree_init
    - make idma_nonfree_ci
  artifacts:
      paths:
        - nonfree/ci/ci.yml

idma:
  stage: idma
  needs: [ init ]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^__deploy__/
      when: never
    - when: always
  trigger:
    include:
      - artifact: nonfree/ci/ci.yml
        job: init
    strategy: depend
